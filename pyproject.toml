[project]
name = "ohtli"
version = "0.1.0"
description = "The tequio.tech monorepo for AI engineering, healthcare automation, and public research."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    { name = "tequio.tech" },
]
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.13.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
